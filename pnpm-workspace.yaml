# Only install package versions that have been public for at least a day
# (supply-chain safety; matches pnpm's default policy in newer versions)
minimumReleaseAge: 1440

# Packages allowed to run install scripts
# pnpm 11+ reads allowBuilds; pnpm 10 reads onlyBuiltDependencies
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  'esbuild': true
  'prisma': true
  'vue-demi': true
  '@parcel/watcher': true
  '@tailwindcss/oxide': true

onlyBuiltDependencies:
  - 'esbuild'
  - 'prisma'
  - '@prisma/client'
  - '@prisma/engines'
  - '@parcel/watcher'
  - 'sharp'
  - 'vue-demi'
  - '@tailwindcss/oxide'
  - 'better-sqlite3'
